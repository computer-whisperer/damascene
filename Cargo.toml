[workspace]
members = ["crates/*", "examples", "tools"]
resolver = "3"

[workspace.package]
authors = ["Christian Balcom <robot.inventor@gmail.com>"]
repository = "https://github.com/computer-whisperer/damascene"
homepage = "https://github.com/computer-whisperer/damascene"
edition = "2024"
rust-version = "1.85"

# Optimize the text rasterization/shaping stack even in dev builds.
# MSDF glyph generation (fdsm + nalgebra math) is ~500x slower at
# opt-level 0 — the startup ASCII warmup alone measured ~19s in a
# debug showcase run vs ~40ms optimized. These are leaf dependencies
# that compile once; workspace crates stay at opt-level 0 so
# incremental iteration speed is unaffected.
[profile.dev.package.fdsm]
opt-level = 3
[profile.dev.package.fdsm-ttf-parser]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
