[package]
name = "damascene-examples"
version = "0.7.0"
edition = "2024"
description = "Damascene — interactive examples built from the reusable host and fixture crates"
license = "MIT OR Apache-2.0"
publish = false

# Binaries auto-discovered from `src/bin/*.rs`.

[[bin]]
name = "counter"
path = "src/bin/counter.rs"
doc = false

[[bin]]
name = "external_wakeup"
path = "src/bin/external_wakeup.rs"
doc = false

[[bin]]
name = "icon_gallery"
path = "src/bin/icon_gallery.rs"
doc = false

[[bin]]
name = "icon_gallery_glass"
path = "src/bin/icon_gallery_glass.rs"
doc = false

[[bin]]
name = "icon_gallery_relief"
path = "src/bin/icon_gallery_relief.rs"
doc = false

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"
doc = false

[dependencies]
damascene-core = { version = "0.7.0", path = "../crates/damascene-core" }
damascene-fixtures = { version = "0.7.0", path = "../crates/damascene-fixtures" }
damascene-markdown = { version = "0.7.0", path = "../crates/damascene-markdown" }
damascene-wgpu = { version = "0.7.0", path = "../crates/damascene-wgpu" }
damascene-winit-wgpu = { version = "0.7.0", path = "../crates/damascene-winit-wgpu" }
wgpu = "30"
# Direct winit + pollster for the `wgpu_integration` bin, which owns its
# own window/event loop instead of going through damascene-winit-wgpu.
winit = "0.30"
pollster = "1.0"
# Off by default. The `profiling` feature pulls these in and forwards
# `damascene-winit-wgpu/profiling` (which transitively turns on the wgpu
# backend + core spans). The showcase binary's `--profile <path>` flag
# attaches `tracing-chrome` and writes a chrome://tracing JSON.
tracing = { version = "0.1", optional = true }
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
profiling = [
    "dep:tracing",
    "dep:tracing-chrome",
    "dep:tracing-subscriber",
    "damascene-winit-wgpu/profiling",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `wayland-data-control` is required so arboard talks to native
# Wayland apps via the wlr data-control protocol. Without it,
# arboard falls back to X11 over XWayland and only round-trips
# clipboard contents between XWayland apps — copies in our app
# don't reach Firefox / gedit / alacritty when those run under
# native Wayland.
arboard = { version = "3", features = ["wayland-data-control"] }
