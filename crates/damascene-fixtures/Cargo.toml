[package]
name = "damascene-fixtures"
version = "0.4.1"
edition = "2024"
description = "Damascene — backend-neutral showcase apps and render fixtures"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.4.1", path = "../damascene-core", default-features = false }
damascene-html = { version = "0.4.1", path = "../damascene-html" }
damascene-markdown = { version = "0.4.1", path = "../damascene-markdown", features = ["html"] }
