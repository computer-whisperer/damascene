[package]
name = "damascene-core"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — backend-agnostic UI library core"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-core"
keywords = ["ui", "gui", "widgets", "framework", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-fonts = { version = "0.7.0", path = "../damascene-fonts", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
# f16 encoding for the wide-color image upload path (`Image::to_scrgb_f16`).
half = "2.7.1"
cosmic-text = "0.19"
fdsm = "0.8"
fdsm-ttf-parser = "0.2"
# 3D linear algebra for the `scene` module's public API (camera,
# transforms, bounds). glam is the de-facto standard apps reach for, so
# the scene API speaks it directly; re-exported from `crate::scene` so
# downstream code can pin this exact version. glam is pre-1.0, so a
# version mismatch would otherwise surface as two incompatible `Vec3`
# types — using the re-export avoids that.
glam = "0.33"
image = { version = "0.25", default-features = false }
kurbo = "0.13"
# AccessKit tree schema — pure data, no platform deps. Optional; see
# the `accessibility` feature. 0.24.1 = crates.io max_stable 2026-08.
accesskit = { version = "0.24.1", optional = true }
# `log` facade for runtime diagnostics that aren't profiling spans — the
# once-per-id duplicate-computed_id warning (issue #64). Always-on (unlike
# the optional `tracing` profiling dep); the winit host and the GPU
# backends emit through `log` too, so a single subscriber catches it.
log = "0.4"
# Bounded LRU cache for shaped `TextLayout`s. Without it, every text
# node in the tree triggers a fresh cosmic-text shape on each frame
# (twice per intrinsic call) — reshaping the same labels over and over
# was a measurable share of the layout pass. Cache hit avoids buffer
# alloc, set_text, shape, and the layout-runs walk.
lru = "0.18"
lyon_tessellation = "1.0.20"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
# FxHash via rustc-hash for the per-frame side maps (computed_rects,
# key_index, interaction state, scroll). Default `RandomState` is
# SipHash-1-3, cryptographic-grade — gross overkill for short owned
# strings keyed by tree path. FxHash is a non-cryptographic
# multiply-then-rotate hash that's a few times faster on the strings we
# actually use, and the layout pass touches these maps once per node
# per frame.
rustc-hash = "2"
# Grapheme-cluster segmentation for the AccessKit text protocol
# (`character_metrics`): AccessKit's per-character tables are defined
# over "smallest selectable unit" clusters, which it cannot compute
# itself. Already in the build graph via cosmic-text and winit, so
# this direct dependency adds no compile weight.
unicode-segmentation = "1.12"
# Optional — pulled in only when the `parallel-raster` feature is on.
# Parallelizes batched MSDF rasterization (`MsdfAtlas::ensure_many`),
# whose per-glyph MTSDF generation is independent and dominates cold
# start. Off-builds carry no rayon in the tree and rasterize serially.
rayon = { version = "1.12", optional = true }
roxmltree = "0.21"
swash = "0.2"
ttf-parser = "0.25.1"
# Optional — pulled in only when the `profiling` feature is on.
# Drives the `profile_span!` macro; off-builds compile away to ().
tracing = { version = "0.1", optional = true }
# Optional — pulled in only when the `shader-introspect` feature is on
# (every GPU backend enables it). Parses registered custom-shader WGSL
# to extract the instance-attribute name → location map that drives
# named uniform routing and Rust↔WGSL drift detection (issue #99).
# Version pinned to match wgpu 30.x's bundled naga and the vulkano/ash
# backends' pins, so every backend parses identical syntax.
naga = { version = "30", features = ["wgsl-in"], optional = true }
usvg = { version = "0.47.0", default-features = false }
# `Instant` that works on wasm32 (browser has no monotonic clock; std's
# Instant::now() panics). API-identical to std::time::Instant on native.
web-time = "1"

[features]
default = ["default_fonts"]
# Lower the laid-out tree into AccessKit `TreeUpdate`s and route
# assistive-technology `ActionRequest`s back through the event
# machinery (see `damascene_core::a11y`). Pulls in the pure-data
# `accesskit` crate (re-exported as `damascene_core::accesskit` so
# hosts share the exact version). The semantic El surface (`.role()`,
# `.aria_label()`, ...) is NOT behind this feature — only the lowering.
# Shipped hosts (damascene-winit-wgpu) enable this by default.
accessibility = ["dep:accesskit"]
# Lights up the `profile_span!` macro across damascene-core (and any
# downstream crate that mirrors the feature). When off, every span call
# expands to `()` and the `tracing` dep is not pulled in — release
# builds carry zero overhead. When on, spans nest naturally and a host
# subscriber (typically `tracing-chrome` for chrome://tracing /
# perfetto) receives them. See `damascene_core::profile`.
profiling = ["dep:tracing"]
# WGSL introspection for custom shaders: parse the registered module
# and extract its instance-attribute names so uniforms can be set by
# name and drift between Rust packing and WGSL unpacking warns loudly
# (issue #99). Enabled by the GPU backends; apps don't toggle this.
shader-introspect = ["dep:naga"]
# Parallelize batched MSDF rasterization (`MsdfAtlas::ensure_many` /
# `IconMsdfAtlas`) across rayon's global thread pool. Per-glyph MTSDF
# generation is the dominant cold-start cost and embarrassingly
# parallel, so on a multi-core machine this cuts atlas warmup by roughly
# an order of magnitude. Off by default; the GPU backends forward it as
# their own `parallel-raster` feature. Packing stays serial.
parallel-raster = ["dep:rayon"]
# Bake the default-font MSDF atlas (Inter + JetBrains Mono printable
# ASCII) at compile time via build.rs and embed it, so the backend's
# `warm_default_glyphs` loads it in a memcpy/repack instead of
# regenerating ~190 glyphs at startup (~340ms -> ~0 on a warm launch).
# Auto-fresh: the build script reruns when the fonts, the MSDF/codec
# source, or the bake params change — no stale-blob maintenance. Adds
# ~1-2MB to the binary. Backends forward this as their own
# `prebaked-default-fonts`. (The build script's deps are always present;
# the feature only gates whether it bakes vs. writes an empty blob.)
prebaked-default-fonts = []
# Bundle damascene-fonts' default font set (Inter + JetBrains Mono +
# NotoColorEmoji + Symbols2 + Math) into the binary. Disable to ship
# your own fonts via `register_font`. The per-format features below are
# activated by `default_fonts` and can also be toggled individually —
# Roboto is no longer in the default set but remains available via the
# `roboto` feature for Material-style applications:
# `damascene-core = { default-features = false, features = ["roboto"] }`.
default_fonts = ["inter", "jetbrains-mono", "emoji", "symbols"]
inter = ["damascene-fonts/inter"]
jetbrains-mono = ["damascene-fonts/jetbrains-mono"]
roboto = ["damascene-fonts/roboto"]
emoji = ["damascene-fonts/emoji"]
symbols = ["damascene-fonts/symbols"]

[build-dependencies]
# Shared with the library via #[path] in build.rs so the compile-time
# default-font bake uses the exact same MSDF generator + snapshot codec
# (no drift). These overlap the normal deps above, so for native builds
# Cargo largely reuses the same compiled artifacts. The font byte blobs
# here are build-time only — just the baked output is embedded, and only
# for the fonts whose features the consumer enabled. Only the
# `prebaked-default-fonts` feature triggers the bake at script run time.
fdsm = "0.8"
fdsm-ttf-parser = "0.2"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"
image = { version = "0.25", default-features = false }
damascene-fonts = { version = "0.7.0", path = "../damascene-fonts", default-features = false, features = ["inter", "jetbrains-mono"] }

[[example]]
name = "settings"
path = "examples/settings.rs"

# Roboto is no longer in `default_fonts`. The Inter↔Roboto comparison
# example genuinely needs it, so it's gated behind the `roboto` feature
# rather than rendering an empty Roboto column on a default build.
[[example]]
name = "font_family_comparison"
path = "examples/font_family_comparison.rs"
required-features = ["roboto"]
