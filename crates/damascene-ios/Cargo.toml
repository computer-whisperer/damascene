[package]
name = "damascene-ios"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene iOS host shell for native wgpu apps (clipboard and link opening not yet wired)"
license = "MIT OR Apache-2.0"
readme = "../../ios/README.md"
documentation = "https://docs.rs/damascene-ios"
keywords = ["ui", "gui", "ios", "wgpu", "mobile"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.7.0", path = "../damascene-core", default-features = false }
damascene-winit-wgpu = { version = "0.7.0", path = "../damascene-winit-wgpu", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
# Routes the `log` facade (host GPU-setup failures, wgpu/winit
# diagnostics) to stderr, which Xcode's console and `simctl launch
# --console-pty` capture. Without this, a surface or adapter failure
# on iOS dies invisibly. Kept dependency-free (no os_log crate): CI
# cross-checks this crate from Linux, where crates that compile a C
# shim against Apple SDK headers cannot build.
log = "0.4"

[features]
default = ["default_fonts", "accessibility"]
# VoiceOver support via AccessKit's iOS adapter, forwarded from
# `damascene-winit-wgpu` (which already wires the adapter for every
# winit platform). ON by default to match the desktop and Android
# hosts; the adapter is inert until an assistive technology queries
# the view. Before this passthrough existed the `default-features =
# false` dependency silently dropped it, so iOS builds exposed no
# accessibility tree at all (Accessibility Inspector showed nothing).
accessibility = ["damascene-winit-wgpu/accessibility"]
# Font passthroughs — forward to `damascene-core`'s font features so an
# app bundle can opt out of the bundled set (NotoColorEmoji alone is
# ~10.7 MB). See issue #49.
default_fonts = ["damascene-core/default_fonts"]
inter = ["damascene-core/inter"]
jetbrains-mono = ["damascene-core/jetbrains-mono"]
roboto = ["damascene-core/roboto"]
emoji = ["damascene-core/emoji"]
symbols = ["damascene-core/symbols"]
