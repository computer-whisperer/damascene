[package]
name = "damascene-android"
version = "0.4.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene Android host shell for native wgpu apps"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.4.2", path = "../damascene-core", default-features = false }
damascene-winit-wgpu = { version = "0.4.2", path = "../damascene-winit-wgpu", default-features = false }
winit = { version = "0.30", features = ["android-native-activity"] }

[features]
default = ["default_fonts"]
# Font passthroughs — forward to `damascene-core`'s font features so an
# APK can opt out of the bundled set (NotoColorEmoji alone is ~10.7 MB).
# See issue #49.
default_fonts = ["damascene-core/default_fonts"]
inter = ["damascene-core/inter"]
jetbrains-mono = ["damascene-core/jetbrains-mono"]
roboto = ["damascene-core/roboto"]
emoji = ["damascene-core/emoji"]
symbols = ["damascene-core/symbols"]
