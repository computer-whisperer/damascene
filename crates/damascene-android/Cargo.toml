[package]
name = "damascene-android"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene Android host shell for native wgpu apps"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.7.0", path = "../damascene-core", default-features = false }
damascene-winit-wgpu = { version = "0.7.0", path = "../damascene-winit-wgpu", default-features = false }
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
# Routes the `log` facade (host GPU-setup failures, wgpu/winit
# diagnostics) to logcat. There is no terminal on Android — without
# this, an adapter-acquisition failure dies invisibly.
android_logger = "0.15"
log = "0.4"

[features]
default = ["default_fonts", "accessibility"]
# TalkBack / assistive-technology support, same default-on policy as
# `damascene-winit-wgpu`: the host injects the AccessKit delegate into
# NativeActivity's content view (no Gradle/Java changes; requires
# minSdk 26 for the embedded-dex loader) and the runtime cost is zero
# until an accessibility service actually queries the view.
accessibility = ["damascene-winit-wgpu/accessibility"]
# Font passthroughs — forward to `damascene-core`'s font features so an
# APK can opt out of the bundled set (NotoColorEmoji alone is ~10.7 MB).
# See issue #49.
default_fonts = ["damascene-core/default_fonts"]
inter = ["damascene-core/inter"]
jetbrains-mono = ["damascene-core/jetbrains-mono"]
roboto = ["damascene-core/roboto"]
emoji = ["damascene-core/emoji"]
symbols = ["damascene-core/symbols"]
