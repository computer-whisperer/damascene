[package]
name = "damascene-winit"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — pure winit → damascene input mappers shared by winit hosts"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-winit"
keywords = ["ui", "gui", "winit", "keyboard", "input"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
# Only the input/cursor vocabulary types are used — fonts and every
# other default stay off so out-of-tree hosts get the mappers without
# dragging in a render stack (the whole point of this crate, #121).
damascene-core = { version = "0.7.0", path = "../damascene-core", default-features = false }
winit = "0.30"
