[package]
name = "damascene-wgpu"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — wgpu backend (native + wasm)"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-wgpu"
keywords = ["ui", "gui", "wgpu", "wasm", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
# `log` facade for runtime diagnostics (debug-build glyph-warmup cliff).
log = "0.4"
damascene-core = { version = "0.8.0", path = "../damascene-core", default-features = false, features = ["shader-introspect"] }
wgpu = "30"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
ttf-parser = "0.25.1"
# Drop-in `Instant::now()` that works on wasm32; std's panics there.
web-time = "1"

# wgpu's WebGPU types are `!Send + !Sync` on wasm32 (no threads in
# vanilla wasm). `AppTextureBackend` requires `Send + Sync` so the type-
# erased `AppTexture` can flow through the backend-neutral paint stream.
# Opt into wgpu's blessed escape hatch on wasm32 only — sound because
# vanilla wasm32 is single-threaded; native targets keep the real impls.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm"] }

[features]
# Forwards to `damascene-core/profiling`. Off by default; flip on to enable
# `profile_span!` inside the wgpu backend's per-frame paths
# (`prepare::gpu_upload`) and let downstream hosts attach a
# tracing subscriber. See `damascene_core::profile`.
profiling = ["damascene-core/profiling"]
# Forwards to `damascene-core/accessibility`: AccessKit tree lowering
# and action routing on the Runner (`accessibility_tree_update` /
# `accessibility_action`). Off by default here; the shipped winit host
# enables it by default.
accessibility = ["damascene-core/accessibility"]
# Forwards to `damascene-core/parallel-raster`: parallelize the MSDF
# glyph-atlas warmup (`warm_default_glyphs`) across rayon's pool. The
# warmup is ~80% of cold start and embarrassingly parallel, so this is
# a large startup win on multi-core machines. Off by default; hosts that
# want it enable `damascene-wgpu/parallel-raster`.
parallel-raster = ["damascene-core/parallel-raster"]
# Forwards to `damascene-core/prebaked-default-fonts`: embed a
# compile-time-baked MSDF atlas for the default fonts so
# `warm_default_glyphs` loads it (memcpy/repack) instead of regenerating
# ~190 glyphs at startup. The big cold-start win for launchers; ~1-2MB
# binary cost. Off by default.
prebaked-default-fonts = ["damascene-core/prebaked-default-fonts"]

[dev-dependencies]
# The normal-dep edge to damascene-core is `default-features = false` so
# downstream hosts can opt out of bundled fonts (issue #49). The render
# tests shape labelled scenes, so test builds re-enable the default font
# set here; the published crate's dependency graph is unaffected.
damascene-core = { version = "0.8.0", path = "../damascene-core" }
png = "0.18"
pollster = "1.0"
half = "2.7.1"

[package.metadata.docs.rs]
all-features = true
