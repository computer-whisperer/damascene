[package]
name = "damascene-wgpu"
version = "0.4.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — wgpu backend (native + wasm)"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-wgpu"
keywords = ["ui", "gui", "wgpu", "wasm", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.4.2", path = "../damascene-core", default-features = false }
wgpu = "29"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
ttf-parser = "0.25.1"
# Drop-in `Instant::now()` that works on wasm32; std's panics there.
web-time = "1"

# wgpu's WebGPU types are `!Send + !Sync` on wasm32 (no threads in
# vanilla wasm). `AppTextureBackend` requires `Send + Sync` so the type-
# erased `AppTexture` can flow through the backend-neutral paint stream.
# Opt into wgpu's blessed escape hatch on wasm32 only — sound because
# vanilla wasm32 is single-threaded; native targets keep the real impls.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm"] }

[features]
# Forwards to `damascene-core/profiling`. Off by default; flip on to enable
# `profile_span!` inside the wgpu backend's per-frame paths
# (`prepare::gpu_upload`) and let downstream hosts attach a
# tracing subscriber. See `damascene_core::profile`.
profiling = ["damascene-core/profiling"]

[dev-dependencies]
# The normal-dep edge to damascene-core is `default-features = false` so
# downstream hosts can opt out of bundled fonts (issue #49). The render
# tests shape labelled scenes, so test builds re-enable the default font
# set here; the published crate's dependency graph is unaffected.
damascene-core = { version = "0.4.2", path = "../damascene-core" }
png = "0.18"
pollster = "0.4"
half = "2.7.1"
