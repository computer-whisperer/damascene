[package]
name = "damascene-vulkano"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — Vulkan backend via vulkano + naga WGSL→SPIR-V (native only)"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-vulkano"
keywords = ["ui", "gui", "vulkan", "vulkano", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.6.0", path = "../damascene-core", default-features = false, features = ["shader-introspect"] }
# Pinned to match wgpu 30.x's bundled naga so the two backends parse
# WGSL identically and a shader that compiles for one compiles for both.
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
vulkano = "0.35"
bytemuck = { version = "1.21", features = ["derive"] }
smallvec = "1"
cosmic-text = "0.19"
ttf-parser = "0.25.1"
# `log` facade for runtime diagnostics, matching damascene-core/-wgpu —
# a single subscriber catches backend warnings too.
log = "0.4"

[dev-dependencies]
# The normal-dep edge to damascene-core is `default-features = false` so
# downstream hosts can opt out of bundled fonts (issue #49). The render
# tests shape labelled scenes, so test builds re-enable the default font
# set here; the published crate's dependency graph is unaffected.
damascene-core = { version = "0.6.0", path = "../damascene-core" }
