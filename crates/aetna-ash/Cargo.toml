[package]
name = "aetna-ash"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Aetna — low-level ash/Vulkan renderer adapter for host-owned renderers"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/aetna-ash"
keywords = ["ui", "gui", "vulkan", "ash", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
aetna-core = { version = "0.4.0", path = "../aetna-core" }
ash = "0.38"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
naga = { version = "29", features = ["wgsl-in", "spv-out"] }
ttf-parser = "0.25"
web-time = "1"

[features]
# Forwards to `aetna-core/profiling`. Off by default; flip on to enable
# the same instrumentation surface as the other renderer backends.
profiling = ["aetna-core/profiling"]
