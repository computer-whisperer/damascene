[package]
name = "damascene-html"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — HTML to El tree transformer"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.4.0", path = "../damascene-core" }
# html5ever's official tree builder + the community-maintained rcdom.
# `markup5ever_rcdom` publishes under `0.39.0+unofficial` because the
# Servo team archived the official crate; the `+unofficial` build-
# metadata suffix is a labelling thing and Cargo treats the version as
# equal-precedence to `0.39.0`.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
