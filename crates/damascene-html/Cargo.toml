[package]
name = "damascene-html"
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — HTML to El tree transformer"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["ui", "gui", "html", "renderer"]
categories = ["gui", "text-processing"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.4.4", path = "../damascene-core", default-features = false }
# html5ever's official tree builder + the community-maintained rcdom.
# `markup5ever_rcdom` publishes under `0.39.0+unofficial` because the
# Servo team archived the official crate; the `+unofficial` build-
# metadata suffix is a labelling thing and Cargo treats the version as
# equal-precedence to `0.39.0`.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[dev-dependencies]
# Tests shape real text (list-marker measurement), so re-enable the
# default font set for test builds; the normal-dep edge stays
# `default-features = false` (issue #49).
damascene-core = { version = "0.4.4", path = "../damascene-core" }
