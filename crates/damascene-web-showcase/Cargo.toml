[package]
name = "damascene-web-showcase"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — browser showcase demo"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
damascene-fixtures = { version = "0.4.3", path = "../damascene-fixtures" }
damascene-web = { version = "0.4.3", path = "../damascene-web" }

[features]
profiling = ["damascene-web/profiling"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
