<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damascene — Showcase</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1c1c1c;
            font-family: system-ui, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="damascene_canvas" tabindex="0"></canvas>
    <script type="module">
        import init from './pkg/damascene_web_showcase.js';
        const showFatalError = (message) => {
            document.body.innerHTML =
                '<pre style="color:#fff;padding:1em;white-space:pre-wrap;">' +
                'damascene-web-showcase failed to start.\n\n' + message + '</pre>';
        };
        // GPU adapter/device setup is async and finishes after init()
        // resolves, so its failures (no WebGPU and no WebGL2, GPU
        // process crash, …) can't reject the init() promise. The host
        // reports them as a bubbling `damascene-error` CustomEvent on
        // the canvas instead.
        document.getElementById('damascene_canvas')
            .addEventListener('damascene-error', (e) => {
                console.error('damascene-web-showcase:', e.detail);
                showFatalError(e.detail.message);
            });
        init().catch(err => {
            console.error('failed to start damascene-web-showcase:', err);
            showFatalError('Did you run `tools/build_web.sh`?\n\n' + String(err));
        });
    </script>
</body>
</html>
