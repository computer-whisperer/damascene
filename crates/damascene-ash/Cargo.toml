[package]
name = "damascene-ash"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — low-level ash/Vulkan renderer adapter for host-owned renderers"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-ash"
keywords = ["ui", "gui", "vulkan", "ash", "renderer"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.7.0", path = "../damascene-core", default-features = false, features = ["shader-introspect"] }
ash = "0.38"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
# `log` facade for runtime diagnostics, matching damascene-core/-wgpu/-vulkano
# — shader-introspection fallback warnings (issue #99) emit through it.
log = "0.4"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
ttf-parser = "0.25"
web-time = "1"

[features]
# Forwards to `damascene-core/profiling`. Off by default; flip on to enable
# the same instrumentation surface as the other renderer backends.
profiling = ["damascene-core/profiling"]

[dev-dependencies]
# The normal-dep edge to damascene-core is `default-features = false` so
# downstream hosts can opt out of bundled fonts (issue #49). The render
# tests shape labelled scenes, so test builds re-enable the default font
# set here; the published crate's dependency graph is unaffected.
damascene-core = { version = "0.7.0", path = "../damascene-core" }
