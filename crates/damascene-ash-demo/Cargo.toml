[package]
name = "damascene-ash-demo"
version = "0.8.0"
edition = "2024"
description = "Damascene — ash native harness and backend smoke tools"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/bin/hello.rs"
doc = false

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"
doc = false

[dependencies]
damascene-ash = { version = "0.8.0", path = "../damascene-ash" }
damascene-core = { version = "0.8.0", path = "../damascene-core" }
damascene-fixtures = { version = "0.8.0", path = "../damascene-fixtures" }
damascene-winit = { version = "0.8.0", path = "../damascene-winit" }
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
web-time = "1"
winit = "0.30"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
open = "5"
