[package]
name = "aetna-web"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Aetna browser host for wasm apps"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/aetna-web"
keywords = ["ui", "gui", "wasm", "web", "wgpu"]
categories = ["gui", "rendering", "wasm", "web-programming"]

[dependencies]
aetna-core = { version = "0.4.0", path = "../aetna-core" }
aetna-wgpu = { version = "0.4.0", path = "../aetna-wgpu" }
wgpu = "29"
winit = "0.30"

[features]
# Forwards to `aetna-core/profiling` + `aetna-wgpu/profiling` so all
# `profile_span!` calls compile in. The wasm subscriber
# (`tracing-wasm`, declared in the wasm32 target table below) emits
# each span to the browser's User Timing API, where they show up as
# named measures in DevTools → Performance. Build with
# `wasm-pack build --target web crates/aetna-web-showcase --features profiling`.
profiling = [
    "dep:tracing-wasm",
    "aetna-core/profiling",
    "aetna-wgpu/profiling",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen is the FFI bridge wasm-pack consumes.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
js-sys = "0.3"
# `web_time::Instant` is a wasm-safe shim for `std::time::Instant`
# (the std one panics on wasm32). Used here for the per-frame
# timing breakdown.
web-time = "1"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "ClipboardEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    # InputEvent extends Event with `inputType` so the soft-keyboard
    # path can distinguish character insertion ("insertText") from
    # backspace ("deleteContentBackward") and route accordingly.
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    # PointerEvent is the unified mouse / touch / pen input surface.
    # The web host binds it directly so a touch tap arrives at the
    # runtime tagged as `PointerKind::Touch` rather than collapsed
    # to a mouse event by winit's compatibility layer.
    "PointerEvent",
    # ResizeObserver re-syncs the canvas backing buffer to its CSS
    # box size whenever the layout changes (window resize, devtools
    # toggle, css media-query crossing, etc). Without this the
    # canvas's drawing buffer is whatever we set it to on first
    # paint and the surface ends up stretched until the page reloads.
    "ResizeObserver",
    # VisualViewport reports the visible region of the page minus
    # platform chrome. Bound on the web host so we can detect the
    # on-screen keyboard appearing (it shrinks visualViewport.height
    # without changing the layout viewport) and propagate the
    # resulting bottom inset to apps via `BuildCx::safe_area`.
    "VisualViewport",
    "Window",
] }
# Browser wgpu backends — workspace's plain `wgpu = "29"` only enables
# native backends.
wgpu = { version = "29", features = ["webgl"] }
# Optional — bridges the `tracing` events the `profiling` feature lights
# up to the browser's User Timing API (`performance.mark` /
# `performance.measure`). Each span shows up as a named measure in
# DevTools → Performance. Off in release; pulled in only when this
# crate's `profiling` feature is on.
tracing-wasm = { version = "0.2", optional = true }
