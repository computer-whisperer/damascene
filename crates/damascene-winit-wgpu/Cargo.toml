[package]
name = "damascene-winit-wgpu"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Damascene — optional winit desktop host for the wgpu backend"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/damascene-winit-wgpu"
keywords = ["ui", "gui", "winit", "wgpu", "desktop"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
damascene-core = { version = "0.7.0", path = "../damascene-core", default-features = false }
damascene-wgpu = { version = "0.7.0", path = "../damascene-wgpu" }
damascene-winit = { version = "0.7.0", path = "../damascene-winit" }
# Facade only — GPU-setup failures are logged as well as returned from
# `run()`, so sessions where nobody prints the Err (Android's
# android_main, detached launchers) still leave a trace when a logger
# is installed.
log = "0.4"
pollster = "0.4"
wgpu = "30"
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# AccessKit's winit adapter — one dependency covers the platform
# accessibility APIs on Windows, macOS, Linux, and iOS. 0.33.2 =
# crates.io max_stable 2026-08. The schema crate itself is reached
# through damascene-core's re-export so versions can't skew. Not used
# on Android: its Android backend is hard-wired to GameActivity (it
# reads the activity's `mSurfaceView` field and panics on anything
# else), while this host runs in a NativeActivity — see the
# `android_a11y` module and the direct `accesskit_android` dep below.
accesskit_winit = { version = "0.33.2", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
# Soft-keyboard frame observer (`UIKeyboardWillChangeFrameNotification`)
# feeding `RunnerCore::set_keyboard_inset`: UIKit's safe area never
# includes the keyboard and winit reports no keyboard events. Pure-Rust
# bindings, at the versions winit and accesskit_ios already pull in;
# no SDK-header shim, so the Linux cross-check keeps compiling them.
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "block2",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSValue",
] }
objc2-ui-kit = { version = "0.2", features = ["UIGeometry", "UIResponder", "UIView", "UIWindow"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# `arboard` backs the native clipboard bridge. The core crate stays
# backend-neutral; this host handles platform clipboard IO for common
# selection copy shortcuts.
arboard = { version = "3", features = ["wayland-data-control"] }
# `open` shells out to xdg-open / `start` / `open` for the
# `App::drain_link_opens` host path. Tiny crate, well-maintained, no
# blocking IO inside the call (it spawns the platform launcher).
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
# Side-channel client for `wp_color_management_v1`. We share winit's
# `wl_display` via `Backend::from_foreign_display` rather than opening a
# second connection — same compositor, same surface, our own event queue.
# Gated by the `wayland-color-management` feature so non-color-aware
# builds skip the deps entirely. Versions track what winit already pulls
# in transitively.
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
# `wayland-sys` is a transitive dep of `wayland-backend` but is not
# reexported; we need direct access to `wl_proxy_create_wrapper` to wrap
# winit's `wl_surface` onto our connection.
wayland-sys = { version = "0.31", features = ["client"], optional = true }
# `dlib` provides the `ffi_dispatch!` macro for calling libwayland
# entry points regardless of whether wayland-sys was built with dlopen
# or direct linking (the macro picks the right path at compile time).
dlib = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# Android AccessKit adapter, driven directly (not via accesskit_winit —
# see the comment on that dep). `InjectingAdapter` is view-generic and
# installs its delegate on NativeActivity's content view; the
# `embedded-dex` feature ships the compiled Java delegate inside the
# crate, so APKs need no Gradle/Java-side changes (requires API 26 for
# `InMemoryDexClassLoader`; the showcase manifest's minSdk is 26).
# Adapter code must use this crate's `jni` re-export (0.21) — the
# direct `jni` dep above (clipboard/link bridge) tracks a different
# major and the types don't mix.
accesskit_android = { version = "0.7.5", features = ["embedded-dex"], optional = true }

[features]
default = ["default_fonts", "wayland-color-management", "accessibility"]
# Screen-reader / assistive-technology support: an AccessKit platform
# adapter wired to the runtime's tree lowering and action routing
# (Windows UIA, macOS NSAccessibility, Linux AT-SPI, Android, iOS).
# ON by default — apps get screen-reader support without doing
# anything, and the runtime cost is zero until an assistive technology
# actually connects (adapters activate lazily). Opt out with
# `default-features = false` (re-list the fonts you want).
accessibility = [
    "damascene-wgpu/accessibility",
    "dep:accesskit_winit",
    "dep:accesskit_android",
]
# Font passthroughs — forward to `damascene-core`'s font features so a
# consumer can opt out of the bundled set (see issue #49). The default
# preserves today's behavior; opt out with `default-features = false`
# and re-list the fonts (and `wayland-color-management`) you want.
default_fonts = ["damascene-core/default_fonts"]
inter = ["damascene-core/inter"]
jetbrains-mono = ["damascene-core/jetbrains-mono"]
roboto = ["damascene-core/roboto"]
emoji = ["damascene-core/emoji"]
symbols = ["damascene-core/symbols"]
# Forwards to `damascene-core/profiling` and `damascene-wgpu/profiling`. Off by
# default. When on, the host emits `frame::build` / `frame::prepare` /
# `frame::submit` spans alongside the per-phase spans inside the
# renderer. Hosts attach their own subscriber (e.g. `tracing-chrome`).
profiling = ["damascene-core/profiling", "damascene-wgpu/profiling"]
# Build the Wayland `wp_color_management_v1` driver. On non-Linux
# targets this feature is a no-op (the deps are `cfg(target_os = "linux")`).
# Apps that want byte-for-byte status-quo behavior can disable this with
# `default-features = false` and rebuild without the extra wayland deps.
wayland-color-management = [
    "dep:wayland-backend",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-sys",
    "dep:dlib",
    "dep:raw-window-handle",
]
